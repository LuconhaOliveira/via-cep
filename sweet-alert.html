<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.17.2/dist/sweetalert2.min.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous" defer></script>

    <!-- <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script> -->

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.17.2/dist/sweetalert2.all.min.js" defer></script>

    <script src="./sweet.js" defer></script>
</head>
<body>
    <div class="container mt-5">

        <h1 class="text-center mb-4">Demonstração dos Alertas do SweetAlert2</h1>

        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-header">
                        Alerta Básico
                    </div>
                    <div class="card-body text-center">
                        <button id="alertBasico" class="btn btn-secondary">Exibir Alerta Básico</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-header">
                        Alerta de Sucesso
                    </div>
                    <div class="card-body text-center">
                        <button id="alertSucesso" class="btn btn-success">Exibir Sucesso</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-header">
                        Alerta de Erro
                    </div>
                    <div class="card-body text-center">
                        <button id="alertErro" class="btn btn-danger">Exibir Erro</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-header">
                        Alerta de Aviso
                    </div>
                    <div class="card-body text-center">
                        <button id="alertAviso" class="btn btn-warning">Exibir Aviso</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-header">
                        Alerta Informativo
                    </div>
                    <div class="card-body text-center">
                        <button id="alertInfo" class="btn btn-info">Exibir Informação</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-header">
                        Alerta de Confirmação
                    </div>
                    <div class="card-body text-center">
                        <button id="alertConfirm" class="btn btn-primary">Exibir Confirmação</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-header">
                        Alerta com Input
                    </div>
                    <div class="card-body text-center">
                        <button id="alertInput" class="btn btn-dark">Exibir Prompt</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-header">
                        Alerta com Timer
                    </div>
                    <div class="card-body text-center">
                        <button id="alertTimer" class="btn btn-outline-primary">Exibir com Timer</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-header">
                        Alerta com HTML
                    </div>
                    <div class="card-body text-center">
                        <button id="alertHtml" class="btn btn-outline-secondary">Exibir HTML</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
